# ===== HiTechCloud eKYC iOS SDK — GitLab CI/CD =====
# EN: Verify the bilingual documentation set and publish a GitLab Release on v* tags.
# VI: Xác minh bộ tài liệu song ngữ và phát hành GitLab Release khi có tag v*.
# Repos: https://github.com/hitechcloudvn/hitechcloud-ekyc-ios-sdk · https://gitlab.com/hitechcloudvn/hitechcloud-ekyc-ios-sdk

stages:
  - test
  - release

default:
  interruptible: true

test:docs:
  stage: test
  image: alpine:3.20
  script:
    # EN: Every English doc must have its Vietnamese mirror and vice versa.
    # VI: Mỗi tài liệu tiếng Anh phải có bản tiếng Việt tương ứng và ngược lại.
    - |
      missing=0
      for f in README.md README.vi.md CHANGELOG.md CHANGELOG.vi.md; do
        if [ ! -f "$f" ]; then
          echo "missing: $f / thiếu: $f"
          missing=1
        fi
      done
      exit $missing

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    # EN: Extract the release notes from the CHANGELOG.md section for this version.
    # VI: Trích xuất ghi chú phát hành từ mục tương ứng trong CHANGELOG.md.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      awk -v ver="$VERSION" '
        $0 ~ "^## \\[" ver "\\]" { flag=1; next }
        flag && $0 ~ /^## \\[/ { exit }
        flag { print }
      ' CHANGELOG.md > release-notes.md
      if [ ! -s release-notes.md ]; then
        echo "No CHANGELOG.md section found for [$VERSION] / Không tìm thấy mục [$VERSION] trong CHANGELOG.md" >&2
        exit 1
      fi
      echo "===== Release notes / Ghi chú phát hành ====="
      cat release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'Release $CI_COMMIT_TAG'
    description: './release-notes.md'
